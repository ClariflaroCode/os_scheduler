version: '3.8'
services:
  database:
    image: postgres:15
    environment:
    - POSTGRES_DB=myapp
    - POSTGRES_USER=root
    - POSTGRES_PASSWORD=root
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./backend/db/schema/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
    - "5432:5432"
volumes:
  postgres_data: